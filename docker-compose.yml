services:
  budget-perso-pro:
    build: .
    container_name: budget-perso-pro
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      # Persistance de la base de données SQLite et des logs techniques sur le stockage Proxmox
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=3001
      - DB_PATH=${DB_PATH:-/app/data/budget.db}
      - LOG_DIR=/app/logs
      - STATIC_DIR=/app/dist
      - VITE_ENABLE_PERSONAL_LOAN_DATASET=${VITE_ENABLE_PERSONAL_LOAN_DATASET:-false}
      - TZ=${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

